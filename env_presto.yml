name: presto-env
channels:
  - conda-forge
  - defaults
dependencies:
  - shapely<2.0
  - setuptools<81
  - python=3.10
  - pip
  - git
  - numpy=1.23.5
  - pandas
  - scipy
  - pyarrow
  - pytorch=2.0.*
  - h5py=3.6.0
  - matplotlib=3.6.2
  - tqdm=4.64.1
  - earthengine-api=0.1.334
  - pip:
      - google-cloud-storage==2.2.1
      - einops==0.6.0
      - hurry.filesize
      - webdataset==0.2.31
      - presto @ git+https://github.com/nasaharvest/presto.git